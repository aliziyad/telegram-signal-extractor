version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: signal-extractor-db
    environment:
      POSTGRES_USER: signal_user
      POSTGRES_PASSWORD: signal_password
      POSTGRES_DB: signal_extractor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  signal-extractor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signal-extractor-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Telegram
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      
      # Database
      DATABASE_URL: postgresql://signal_user:signal_password@postgres:5432/signal_extractor
      
      # Supabase
      SUPABASE_INGEST_URL: ${SUPABASE_INGEST_URL}
      SUPABASE_API_KEY: ${SUPABASE_API_KEY}
      COPY_SIGNAL_API_KEY: ${COPY_SIGNAL_API_KEY}
      
      # AI APIs
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      
      # Configuration
      REGEX_ENABLED: "true"
      CLAUDE_ENABLED: "true"
      GEMINI_ENABLED: "false"
      OPENAI_ENABLED: "false"
      
      # Admin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      
      # Schedule
      TIMEZONE: "Asia/Male"
      SCHEDULE_START: "04:00"
      SCHEDULE_END: "22:00"
      
      # Logging
      LOG_LEVEL: "INFO"
      FLASK_DEBUG: "false"
      
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs
      - ./sessions:/app/sessions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:

networks:
  default:
    name: signal-extractor-network
