name: telegram-signal-extractor
services:
- name: signal-extractor
  github:
    repo: YOUR_GITHUB_USERNAME/telegram-signal-extractor
    branch: main
    deploy_on_push: true
  build_command: pip install -r requirements.txt
  run_command: python main.py
  envs:
  - key: TELEGRAM_API_ID
    scope: RUN_AND_BUILD_TIME
    value: ${TELEGRAM_API_ID}
  - key: TELEGRAM_API_HASH
    scope: RUN_AND_BUILD_TIME
    value: ${TELEGRAM_API_HASH}
  - key: TELEGRAM_PHONE
    scope: RUN_AND_BUILD_TIME
    value: ${TELEGRAM_PHONE}
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${DATABASE_URL}
  - key: SUPABASE_INGEST_URL
    scope: RUN_AND_BUILD_TIME
    value: ${SUPABASE_INGEST_URL}
  - key: SUPABASE_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SUPABASE_API_KEY}
  - key: COPY_SIGNAL_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${COPY_SIGNAL_API_KEY}
  - key: CLAUDE_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${CLAUDE_API_KEY}
  - key: GEMINI_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${GEMINI_API_KEY}
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${OPENAI_API_KEY}
  - key: ADMIN_USERNAME
    scope: RUN_AND_BUILD_TIME
    value: ${ADMIN_USERNAME}
  - key: ADMIN_PASSWORD
    scope: RUN_AND_BUILD_TIME
    value: ${ADMIN_PASSWORD}
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${SECRET_KEY}
  - key: REGEX_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: CLAUDE_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "true"
  - key: GEMINI_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: OPENAI_ENABLED
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: TIMEZONE
    scope: RUN_AND_BUILD_TIME
    value: "Asia/Male"
  - key: LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: "INFO"
  http_port: 5000
  instance_count: 1
  instance_size_slug: basic-xs
databases:
- name: signal-extractor-db
  engine: PG
  version: "14"
